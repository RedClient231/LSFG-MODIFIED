name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Required so GITHUB_TOKEN can publish to the rolling 'latest-debug' release.
permissions:
  contents: write

jobs:
  build:
    name: Build LSFG-Android-Application + tools/lsfgdiag debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle (lsfg-app)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lsfg-${{ hashFiles('lsfg-app/**/*.gradle*', 'lsfg-app/**/gradle-wrapper.properties', 'tools/lsfgdiag/**/*.gradle*', 'tools/lsfgdiag/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-lsfg-

      # ---- LSFG-Android-Application (the main app, 4 Mali patches) ----
      - name: Build lsfg-app debug APK
        working-directory: lsfg-app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # ---- tools/lsfgdiag (the diagnostic helper) ----
      - name: Build lsfgdiag debug APK
        working-directory: tools/lsfgdiag
        run: |
          chmod +x ./gradlew
          ./gradlew :diag-app:assembleDebug --stacktrace --no-daemon

      - name: Stage release artifacts
        run: |
          mkdir -p out
          # ABI-split APKs from lsfg-app — main app produces both arm64-v8a + x86_64
          cp lsfg-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             "out/lsfg-android-mali-patches-arm64-v8a-build${{ github.run_number }}.apk"
          cp lsfg-app/app/build/outputs/apk/debug/app-x86_64-debug.apk \
             "out/lsfg-android-mali-patches-x86_64-build${{ github.run_number }}.apk"
          # Diag app — single universal APK
          cp tools/lsfgdiag/diag-app/build/outputs/apk/debug/diag-app-debug.apk \
             "out/lsfgdiag-build${{ github.run_number }}.apk"
          ls -la out/

      - name: Upload all APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-modified-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to a rolling "latest-debug" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-debug"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Latest debug build (build #${{ github.run_number }})" \
            --notes "Auto-published from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC').

          **For your phone (Helio G99 / arm64):** \`lsfg-android-mali-patches-arm64-v8a-build${{ github.run_number }}.apk\`
          **For x86_64 emulators:** \`lsfg-android-mali-patches-x86_64-build${{ github.run_number }}.apk\`
          **Diagnostic helper:** \`lsfgdiag-build${{ github.run_number }}.apk\`" \
            out/*.apk
